server {
    listen 80;
    server_name 47.102.40.95;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/qidian-acme;
    }
    location / { return 301 https://47.102.40.95$request_uri; }
}
server {
    listen 443 ssl;
    server_name 47.102.40.95;
    ssl_certificate /etc/letsencrypt/live/47.102.40.95/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/47.102.40.95/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    auth_basic "Author research workbench";
    auth_basic_user_file /etc/nginx/qidian-workbench.htpasswd;
    client_max_body_size 2m;
    gzip on;
    gzip_comp_level 5;
    gzip_types application/json text/css application/javascript;
    location ^~ /static/ {
        alias /opt/qidian-workbench/current/workbench/static/;
        add_header Cache-Control "no-cache" always;
    }
    location ^~ /market/vendor/ {
        alias /var/www/qidian-heat-analysis/vendor/;
        gzip off;
        add_header Cache-Control "public, max-age=86400";
    }
    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 180s;
    }
}
